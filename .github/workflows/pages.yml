name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install content tools
        run: npm ci

      - name: Test content routing
        run: npm test

      - name: Prepare articles for Jekyll
        env:
          SITE_BASEURL: /${{ github.event.repository.name }}
        run: npm run prepare:content

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.build/docs
          destination: ./_site

      - name: Restore site output ownership
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/_site"

      - name: Build Marp slides
        run: npm run build:slides

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ./_site
          clean-exclude: pr-preview/

      - name: Request GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
