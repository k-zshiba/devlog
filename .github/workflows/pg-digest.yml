name: PostgreSQL Digest

on:
  schedule:
    # JST 07:00 = UTC 22:00 (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      llm_cli:
        description: "LLM CLI (codex / claude / gemini)"
        required: false
        default: "codex"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate PostgreSQL digest
        env:
          DIGEST_LLM_CLI: ${{ github.event.inputs.llm_cli || vars.DIGEST_LLM_CLI || 'codex' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_postgresql_digest.py

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digests/postgresql/*.md digests/postgresql/index.md
          git commit -m "Add PostgreSQL digest for $(date -u +%Y-%m-%d)"
          git push
